<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Daybook</title>
  <meta name="description" content="A private journal organised by year, month and day, plus a notebook of sections and topics.">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232B3FBF'/%3E%3Cpath d='M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 1-4-4z' fill='none' stroke='white' stroke-width='2.2'/%3E%3Cpath d='M13 13h6M13 17h6' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Schibsted+Grotesk:wght@400..700&display=swap" rel="stylesheet">
  <script>
    try { var t = localStorage.getItem('daybook-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#main">Skip to journal</a>

  <header class="top">
    <a class="brand" href="#/" aria-label="Daybook, go to this year">
      <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M9 8h10a4 4 0 0 1 4 4v12H13a4 4 0 0 1-4-4z" fill="none" stroke="var(--bg)" stroke-width="2.2"/><path d="M13 13h6M13 17h6" stroke="var(--bg)" stroke-width="2.2" stroke-linecap="round"/></svg>
      <span>Daybook</span>
    </a>
    <nav class="mainnav" aria-label="Daybook areas">
      <a id="navJournal" href="#/">Journal</a>
      <a id="navNotebook" href="#/notebook">Notebook</a>
      <a id="navRecap" href="#/recap">Weekly recaps</a>
      <a id="navWatch" href="#/watchlist">Weekly watch list</a>
    </nav>
    <form class="search" id="searchForm" role="search">
      <label class="sr-only" for="q">Search journal and notebook</label>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Search everything" autocomplete="off" enterkeyhint="search">
      <kbd aria-hidden="true">/</kbd>
    </form>
    <div class="top-actions">
      <span class="sync" id="syncState" role="status" aria-live="polite"></span>
      <a class="btn btn-primary" id="todayBtn" href="#/">Write today</a>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme">
        <svg class="i-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        <svg class="i-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1"></main>

  <input type="file" id="filePicker" accept="image/*" multiple hidden>
  <input type="file" id="importPicker" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p style="padding:2rem">Daybook needs JavaScript to run.</p></noscript>
  <script src="app.js"></script>
</body>
</html>
